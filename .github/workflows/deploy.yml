name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          VITE_SHOW_COMING_SOON: ${{ secrets.VITE_SHOW_COMING_SOON }}
          VITE_INSTANT_PRINTING_COMING_SOON: ${{ secrets.VITE_INSTANT_PRINTING_COMING_SOON }}
          VITE_ENABLE_EMAIL_NOTIFICATIONS: ${{ secrets.VITE_ENABLE_EMAIL_NOTIFICATIONS }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_CONTACT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CONTACT_TEMPLATE_ID }}
          VITE_EMAILJS_ORDER_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_ORDER_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_TO_EMAIL: ${{ secrets.VITE_EMAILJS_TO_EMAIL }}
          VITE_CONTACT_NUMBER: ${{ secrets.VITE_CONTACT_NUMBER }}
          VITE_GOOGLE_DRIVE_API_KEY: ${{ secrets.VITE_GOOGLE_DRIVE_API_KEY }}
          VITE_GOOGLE_DRIVE_REELS_FOLDER_ID: ${{ secrets.VITE_GOOGLE_DRIVE_REELS_FOLDER_ID }}
          VITE_GOOGLE_DRIVE_VIDEOS_FOLDER_ID: ${{ secrets.VITE_GOOGLE_DRIVE_VIDEOS_FOLDER_ID }}
          VITE_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_APPS_SCRIPT_URL }}
          VITE_GOOGLE_ORDERS_SHEET_ID: ${{ secrets.VITE_GOOGLE_ORDERS_SHEET_ID }}
          VITE_GOOGLE_DRIVE_CLIENT_FOLDER_ID: ${{ secrets.VITE_GOOGLE_DRIVE_CLIENT_FOLDER_ID }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
